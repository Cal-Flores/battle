<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Results - Battle Royale</title>
        <link rel="stylesheet" href="../static/main_page.css">
        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
    </head>

    <body class="result">
        {% include 'nav.html' %}

        <a class="allamerican-btn" href="/all-americans">
            🏆 Multiple Time All-Americans
        </a>
        <div class="rescont">
            {% for res in results %}

            <div class="resultdiv">


                <h3 class="tourtitle">
                    🏆 {{ res.tour_name }}
                </h3>
                <div class="grid16">

                    <div class="place-card"><span>1</span><img class="resimgb" src="{{res.first}}"></div>
                    <div class="place-card"><span>2</span><img class="resimgb" src="{{res.second}}"></div>
                    <div class="place-card"><span>3</span><img class="resimgb" src="{{res.third}}"></div>
                    <div class="place-card"><span>4</span><img class="resimgb" src="{{res.fourth}}"></div>

                    <div class="place-card"><span>5</span><img class="resimgb" src="{{res.fifth}}"></div>
                    <div class="place-card"><span>6</span><img class="resimgb" src="{{res.sixth}}"></div>
                    <div class="place-card"><span>7</span><img class="resimgb" src="{{res.seventh}}"></div>
                    <div class="place-card"><span>8</span><img class="resimgb" src="{{res.eigth}}"></div>

                    <div class="place-card"><span>9</span><img class="resimgb" src="{{res.ninth}}"></div>
                    <div class="place-card"><span>10</span><img class="resimgb" src="{{res.tenth}}"></div>
                    <div class="place-card"><span>11</span><img class="resimgb" src="{{res.eleventh}}"></div>
                    <div class="place-card"><span>12</span><img class="resimgb" src="{{res.twelfth}}"></div>

                    <div class="place-card"><span>13</span><img class="resimgb" src="{{res.thirtenth}}"></div>
                    <div class="place-card"><span>14</span><img class="resimgb" src="{{res.fourtenth}}"></div>
                    <div class="place-card"><span>15</span><img class="resimgb" src="{{res.fifthtenth}}"></div>
                    <div class="place-card"><span>16</span><img class="resimgb" src="{{res.sixtenth}}"></div>

                </div>

            </div>

            {% endfor %}

        </div>

        <div style="margin: auto;" class="h2hsub">
            <form action="/new_placement">
                <input class="oppbtn" type="submit" value="New Result">
            </form>
        </div>

        <style>
            .result {
                min-height: 100vh;
                background-size: cover;
                background-attachment: fixed;
                background-position: center;
            }

            .rescont {
                width: 100%;
                margin: auto;
                padding-top: 10px;
                padding-bottom: 40px;

                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }

            .resultdiv {
                width: 400px;
                margin: 10px;
                padding: 10px;

                background: rgba(0, 0, 0, .42);
                backdrop-filter: blur(7px);

                border-radius: 16px;

                box-sizing: border-box;
            }



            .grid16 {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .place-card {
                position: relative;
            }

            .place-card span {
                position: absolute;

                top: 5px;
                left: 5px;

                width: 22px;
                height: 22px;

                display: flex;
                align-items: center;
                justify-content: center;

                border-radius: 50%;

                background: rgba(0, 0, 0, .78);
                color: white;

                font-size: 11px;
                font-weight: bold;

                z-index: 5;
            }

            .resimgb {
                width: 100%;
                aspect-ratio: 1 / 1;

                object-fit: cover;
                display: block;

                border-radius: 8px;
            }

            .h2hsub {
                display: flex;
                justify-content: center;
                padding-bottom: 40px;
            }

            .oppbtn {
                padding: 12px 24px;

                border: none;
                border-radius: 8px;

                background: rgba(255, 255, 255, .18);
                color: white;

                backdrop-filter: blur(6px);

                cursor: pointer;
            }

            @media(max-width: 900px) {
                .resultdiv {
                    width: 92%;
                    max-width: 420px;
                }
            }

            .resultdiv {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
            }

            .tourtitle {
                display: block !important;
                width: 100% !important;
                text-align: center !important;
                margin: 0 0 12px 0 !important;
                color: whitesmoke;
            }

            .grid16 {
                width: 100% !important;
            }

            .allamerican-btn {

                display: block;

                width: fit-content;

                margin: 0 auto 25px auto;

                padding: 12px 24px;

                text-decoration: none;

                color: white;

                font-weight: bold;

                font-size: 18px;

                border-radius: 10px;

                background:
                    rgba(0, 0, 0, .45);

                backdrop-filter:
                    blur(8px);

                transition: .2s;
                margin-top: 115px;
            }

            .allamerican-btn:hover {

                transform: translateY(-2px);

                background:
                    rgba(0, 0, 0, .65);
            }
        </style>

    </body>

</html>
