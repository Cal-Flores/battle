<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Team Score | Battle Royale</title>
        <link rel="stylesheet" href="../static/main_page.css">
        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <style>
            @import url('https://fonts.cdnfonts.com/css/ninja-naruto');
        </style>
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
    </head>

    <body id="teamboard">
        {% include 'nav.html' %}
        <div id="teamcont">
            <h2>{{tour.name}} - Team Scores</h2>
            {% for score in scores %}
            <div class="oneteamscore">
                <img id="teamlogo" src='{{score.logo}}'>
                <div class="teaminfo"><a id="Tname">{{score.team}}</a></div>
                <div class="teaminfo"><a id="Tname" href="score/{{id}}/{{score.team}}">{{score.score}} pts</a></div>
            </div>
            {% endfor %}
        </div>
    </body>

</html>
