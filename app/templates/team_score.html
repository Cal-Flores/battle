<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> {{tour.name}} | Team Score</title>
        <link rel="stylesheet" href="../static/main_page.css">
        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <style>
            @import url('https://fonts.cdnfonts.com/css/ninja-naruto');
        </style>
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
    </head>

    <body id="teamboard">
        {% include 'nav.html' %}
        <div id="teamcont">
            <h2>{{ tour.name }} - Team Scores</h2>
            <a href="/tournamentpage/{{tour.id}}" style="
                  display:inline-block;
                  padding:8px 14px;
                  background:#161a21;
                  color:white;
                  border:1px solid #a97608;
                  border-radius:6px;
                  text-decoration:none;
                  font-size:12px;
                  font-weight:600;
                  margin-top:5px;
                  margin-left: 45%;
               ">
                Advanced Stats
            </a>
            {% for score in scores %}
            <div class="oneteamsc">
                <span class="rank">{{ loop.index }}.</span>
                <img id="teamlogo" src="{{ score.logo }}">
                <div class="teaminfo"><a id="Tname">{{ score.team }}</a></div>
                <div class="teaminfo"><a id="Tname" href="score/{{ id }}/{{ score.team }}">{{ score.score }} pts</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </body>

</html>
