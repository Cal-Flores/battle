<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Duals -Battle Royale</title>
        <link rel="stylesheet" href="../static/main_page.css">
        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <style>
            @import url('https://fonts.cdnfonts.com/css/ninja-naruto');

            #leader {
                color: white;
            }
        </style>
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
    </head>

    <body id="leader">
        {%include 'nav.html'%}
        <h2>DUAL</h2>
        <div>
            <p>{{dual.away}} -- {{away_score}}</p>
            <p>vs</p>
            <p>{{dual.home}} -- {{home_score}}</p>
        </div>
        <div>
            {% for player in players%}
            <div class="oppperson">
                <img id="oppimg" src="{{player.winner.img}}">
                <a href='player/{{player.winner.id}}' class="oppnum">{{player.winner.name}}</a>
                <img id="opplogo" src="{{player.winner.logo}}">
            </div>
            <div class="oppperson">
                <img id="oppimg" src="{{player.loser.img}}">
                <a href='player/{{player.loser.id}}' class="oppnum">{{player.loser.name}}</a>
                <img id="opplogo" src="{{player.loser.logo}}">
            </div>

            {% endfor%}
        </div>
        {% for opp in records%}
        <div class="oppperson2">
            <div class="tournum">{{opp.score}}</div>
            <div id="tourround" class="tournum">{{opp.round}}</div>
            <a href="/tournament/{{opp.tour_name}}" class="tournum">{{opp.tour_name}}</a>
            <div class="edrcont">
                <a class="edrecord" href="/record/edit/{{opp.id}}">✎</a>
                <a class="edrecord" href="/delete/{{opp.id}}">🗑</a>
            </div>
        </div>
        {% endfor%}
    </body>

</html>
