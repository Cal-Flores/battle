    <head>
        <meta charset="UTF-8">

        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
    </head>

    <body id="matchz">

        <div id="players-json" data-players='{{ players | tojson | safe }}'></div>

        <div class="blind-rank-container">
            <h1>Rank Puzzle Mode</h1>

            <h2>Fighter Pool</h2>
            <div id="fighterPool" class="fighter-pool"></div>

            <h2>Place Them 1-10</h2>
            <div id="rankBoard" class="rank-board"></div>

            <button id="revealBtn" style="display:none;">Reveal Results</button>

            <div id="resultsBox"></div>
        </div>

        </div>

        <script>
            const players = JSON.parse(document.getElementById("players-json").dataset.players);

            let puzzlePlayers = [];
            let selectedPlayer = null;
            let placements = {};

            const fighterPool = document.getElementById("fighterPool");
            const rankBoard = document.getElementById("rankBoard");
            const revealBtn = document.getElementById("revealBtn");
            const resultsBox = document.getElementById("resultsBox");

            function shuffleArray(arr) {
                return [...arr].sort(() => Math.random() - 0.5);
            }

            function initGame() {
                puzzlePlayers = shuffleArray(players).slice(0, 10);

                renderFighterPool();
                renderRankBoard();
            }

            function renderFighterPool() {
                fighterPool.innerHTML = "";

                puzzlePlayers.forEach(player => {
                    const card = document.createElement("div");
                    card.classList.add("pool-fighter");
                    card.dataset.id = player.id;

                    card.innerHTML = `
            <img src="${player.img}" class="circle-img">
            <div class="fighter-name">${player.name}</div>
            <div class="fighter-rank">Rank hidden</div>
        `;

                    card.addEventListener("click", () => selectPlayer(player, card));
                    fighterPool.appendChild(card);
                });
            }

            function renderRankBoard() {
                rankBoard.innerHTML = "";

                for (let i = 1; i <= 10; i++) {
                    const slot = document.createElement("div");
                    slot.classList.add("rank-slot", "empty-rank-slot");
                    slot.dataset.position = i;

                    slot.innerHTML = `
            <div class="rank-number">#${i}</div>
            <div class="empty-circle small-empty">?</div>
            <div class="fighter-name">Open Slot</div>
        `;

                    slot.addEventListener("click", () => placePlayer(i, slot));
                    rankBoard.appendChild(slot);
                }
            }

            function selectPlayer(player, card) {
                if (card.classList.contains("used-pool-fighter")) return;

                document.querySelectorAll(".pool-fighter").forEach(c => {
                    c.classList.remove("selected-pool-fighter");
                });

                selectedPlayer = player;
                card.classList.add("selected-pool-fighter");
            }

            function placePlayer(position, slot) {
                if (!selectedPlayer) return;

                const oldPosition = Object.keys(placements).find(pos => {
                    return placements[pos].id === selectedPlayer.id;
                });

                if (oldPosition) {
                    delete placements[oldPosition];
                    const oldSlot = document.querySelector(`.rank-slot[data-position="${oldPosition}"]`);
                    resetSlot(oldSlot, oldPosition);
                }

                if (placements[position]) {
                    const oldPlayer = placements[position];
                    const oldCard = document.querySelector(`.pool-fighter[data-id="${oldPlayer.id}"]`);
                    oldCard.classList.remove("used-pool-fighter");
                }

                placements[position] = selectedPlayer;

                slot.classList.remove("empty-rank-slot");
                slot.classList.add("filled-rank-slot");

                slot.innerHTML = `
        <div class="rank-number">#${position}</div>
        <img src="${selectedPlayer.img}" class="circle-img">
        <div class="fighter-name">${selectedPlayer.name}</div>
        <div class="fighter-rank">Rank hidden</div>
    `;

                const selectedCard = document.querySelector(`.pool-fighter[data-id="${selectedPlayer.id}"]`);
                selectedCard.classList.add("used-pool-fighter");
                selectedCard.classList.remove("selected-pool-fighter");

                selectedPlayer = null;

                if (Object.keys(placements).length === 10) {
                    revealBtn.style.display = "inline-block";
                }
            }

            function resetSlot(slot, position) {
                slot.classList.remove("filled-rank-slot", "correct-slot", "wrong-slot");
                slot.classList.add("empty-rank-slot");

                slot.innerHTML = `
        <div class="rank-number">#${position}</div>
        <div class="empty-circle small-empty">?</div>
        <div class="fighter-name">Open Slot</div>
    `;
            }

            function revealResults() {
                const placedArray = Object.keys(placements).map(position => {
                    return {
                        position: Number(position),
                        player: placements[position]
                    };
                });

                const trueOrder = [...placedArray].sort((a, b) => {
                    return a.player.rank - b.player.rank;
                });

                let correctCount = 0;

                placedArray.forEach(choice => {
                    const correctSpot = trueOrder.findIndex(item => item.player.id === choice.player.id) + 1;
                    const slot = document.querySelector(`.rank-slot[data-position="${choice.position}"]`);

                    if (choice.position === correctSpot) {
                        correctCount++;
                        slot.classList.add("correct-slot");
                    } else {
                        slot.classList.add("wrong-slot");
                    }

                    slot.innerHTML += `
            <div class="true-rank-info">
                True Spot: #${correctSpot}<br>
                Game Rank: ${choice.player.rank}
            </div>
        `;
                });

                let html = `
        <h2>Final Results</h2>
        <div class="final-score">${correctCount}/10 Correct</div>
        <h3>Correct Order</h3>
        <div class="true-order-list">
    `;

                trueOrder.forEach((item, index) => {
                    html += `
            <div class="true-order-card">
                <span>#${index + 1}</span>
                <img src="${item.player.img}" class="mini-img">
                <strong>${item.player.name}</strong>
                <small>Rank: ${item.player.rank}</small>
            </div>
        `;
                });

                html += `</div>`;

                resultsBox.innerHTML = html;
                revealBtn.disabled = true;
            }

            revealBtn.addEventListener("click", revealResults);

            initGame();
        </script>

    </body>

</html>
