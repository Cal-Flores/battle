<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Advanced Statistics</title>
        <link rel="stylesheet" href="../static/main_page.css">
        <link href="https://fonts.cdnfonts.com/css/ninja-naruto" rel="stylesheet">
        <style>
            @import url('https://fonts.cdnfonts.com/css/ninja-naruto');

            #chart {
                background-color: #4a4848;
                width: 800px;
                height: 600px;
                margin: auto;
            }

            body {
                margin: 0;
                padding: 20px;
                background-color: #f0f0f0;
                border-Color: rgb(255, 255, 255)
            }
        </style>
        <link type="image/x-icon" rel="icon" href="../static/images/favicon.ico">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    </head>

    <body id="advstatbg">
        {% include 'nav.html' %}
        <h1 style="margin-top: 6%; margin-bottom: 3%;">Advanced Statistics</h1>
        <canvas id="chart"></canvas>
        <canvas id="pieChart" width="400" height="400"></canvas>
        <div id="myDiv" data-values='{{ rank | tojson | safe }}'></div>
        <canvas id="pieChart"></canvas>









        <script>

            const pieData = {
                labels: ['Pins', 'Tech Falls', 'Major Decisions', 'Decisions'],
                datasets: [{
                    label: 'Win Types',
                    data: [5, 3, 7, 10], // ← Replace these with your actual values or Jinja variable
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)',
                        'rgba(54, 162, 235, 0.7)',
                        'rgba(255, 206, 86, 0.7)',
                        'rgba(75, 192, 192, 0.7)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)'
                    ],
                    borderWidth: 1
                }]
            };
            const pieConfig = {
                type: 'pie',
                data: pieData,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: 'white'
                            }
                        }
                    }
                }
            };

            const pieCtx = document.getElementById('pieChart').getContext('2d');
            new Chart(pieCtx, pieConfig);


            /////////////////   LINE CHART /////////////////////////////////////////////
            var gameChart;
            const raw = $('#myDiv').attr('data-values'); // returns a string
            const parsed = JSON.parse(raw); // safely parsed as array
            console.log(parsed); // [1, 2, 3]

            function renderChart() {
                var tournaments = [1, 2, 3, 'Current'];
                var rank = parsed;

                var dataset1 = {
                    label: "Rank",
                    data: rank,
                    borderColor: 'rgba(255, 27, 27,1)',
                    // borderColor: 'rgba(255, 99, 132, 1)', // Line color
                    fill: false,
                    tension: 0.1
                };
                var chartData = {
                    labels: tournaments,
                    datasets: [dataset1]
                };

                var canvas = document.getElementById("chart");
                var config = {
                    type: "line",
                    data: chartData,
                    options: {
                        responsive: false,  // Set this to false so Chart.js respects the size we set in the CSS
                        plugins: {
                            datalabels: {
                                display: true,
                                align: 'top', // Position above the data point
                                font: {
                                    weight: 'bold',
                                    size: 16 // Make font size slightly smaller for better fitting
                                },
                                color: 'white', // Text color
                                backgroundColor: 'rgba(0, 0, 0, 0.7)', // Dark background color for labels
                                borderRadius: 5, // Rounded corners for label background
                                padding: 6, // Padding inside label background
                                borderWidth: 2, // Border width for label background
                                borderColor: 'rgba(255, 255, 255, 0.8)', // Label background border color
                                formatter: (value) => value // Display the value directly on data point
                            }
                        },
                        scales: {
                            y: {
                                min: 1,
                                max: 128,
                                reverse: true,
                                ticks: {
                                    color: 'white',
                                    stepSize: 16
                                },
                                title: {
                                    display: true,
                                    text: 'Rank',
                                    color: 'white'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'Tournament',
                                    color: 'white'
                                },
                                ticks: {
                                    color: 'white' // <- x-axis tick color
                                },
                            }
                        }
                    }
                };

                if (gameChart) {
                    gameChart.config.data = chartData;
                    gameChart.update();
                } else {
                    gameChart = new Chart(canvas, config);
                }
            }
            renderChart();
        </script>

    </body>

</html>
